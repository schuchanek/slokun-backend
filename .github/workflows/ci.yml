name: backend-ci

on:
  push:
    branches:
      - main
      - schuchanek-nestjs-backend-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript app
        run: npm run build

      - name: Validate app structure
        run: |
          test -f package.json
          test -f tsconfig.build.json
          test -d src
